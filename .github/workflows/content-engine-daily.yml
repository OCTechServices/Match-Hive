name: Content Engine — Daily Publish

# Cadence by platform:
#   Instagram — once daily at 23:00 UTC (6 PM ET) — full day recap after results are in
#   Twitter   — every 4h on match days: 11, 15, 19, 23 UTC (6AM/10AM/2PM/6PM ET)
#               Twitter handles reactive score/result content throughout the day
#
# After group stage ends (June 28): both platforms drop to once daily at 23:00 UTC
#
# Switch: set TWITTER_ONLY=true on the 11, 15, 19 UTC runs; full run at 23 UTC

on:
  schedule:
    - cron: '0 11 * * *'   # Twitter only — 6 AM ET
    - cron: '0 15 * * *'   # Twitter only — 10 AM ET
    - cron: '0 19 * * *'   # Twitter only — 2 PM ET
    - cron: '0 23 * * *'   # Full run (IG + Twitter + Facebook copy) — 6 PM ET
  workflow_dispatch:
    inputs:
      twitter_only:
        description: 'Twitter only (skip IG render + publish)'
        required: false
        default: 'false'

jobs:
  publish:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repo
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install dependencies
        working-directory: scripts/content-engine
        run: |
          pip install -r requirements.txt
          playwright install chromium

      - name: Run content engine
        working-directory: scripts/content-engine
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          FOOTBALL_DATA_API_KEY: ${{ secrets.FOOTBALL_DATA_API_KEY }}
          IG_ACCESS_TOKEN: ${{ secrets.MATCH_HIVE_IG_ACCESS_TOKEN }}
          IG_USER_ID: ${{ secrets.MATCH_HIVE_IG_USER_ID }}
          IMGBB_API_KEY: ${{ secrets.IMGBB_API_KEY }}
          TWITTER_API_KEY: ${{ secrets.MATCH_HIVE_TWITTER_API_KEY }}
          TWITTER_API_SECRET: ${{ secrets.MATCH_HIVE_TWITTER_API_SECRET }}
          TWITTER_ACCESS_TOKEN: ${{ secrets.MATCH_HIVE_TWITTER_ACCESS_TOKEN }}
          TWITTER_ACCESS_SECRET: ${{ secrets.MATCH_HIVE_TWITTER_ACCESS_SECRET }}
          # Full run at 23 UTC only — Twitter-only for 11/15/19 UTC runs
          TWITTER_ONLY: ${{ (github.event.schedule == '0 11 * * *' || github.event.schedule == '0 15 * * *' || github.event.schedule == '0 19 * * *') && 'true' || github.event.inputs.twitter_only || 'false' }}
        run: |
          if [ "$TWITTER_ONLY" = "true" ]; then
            python main.py --twitter-only
          else
            python main.py
          fi

      - name: Commit updated schedule files
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add scripts/content-engine/output/schedule.json \
                  scripts/content-engine/output/twitter_schedule.json \
                  scripts/content-engine/output/facebook_copy.json || true
          git diff --staged --quiet || git commit -m "chore: update content schedule [skip ci]"
          git push || true
