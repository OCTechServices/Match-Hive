name: Content Engine — Daily Publish

# Cadence by platform:
#   Instagram — once daily at 04:00 UTC (midnight ET) — full day recap after ALL results are in
#               Latest group stage matches kick off at 9 PM ET and finish ~11 PM ET,
#               so 04 UTC is the earliest safe window to capture every result.
#   Twitter   — every 4h during match days: 11, 15, 19, 23 UTC (7AM/11AM/3PM/7PM ET)
#               Twitter handles reactive score/result content throughout the day
#
# Switch: TWITTER_ONLY=true on the 11/15/19/23 UTC runs; full run at 04 UTC

on:
  schedule:
    - cron: '0 11 * * *'   # Twitter only — 7 AM ET
    - cron: '0 15 * * *'   # Twitter only — 11 AM ET
    - cron: '0 19 * * *'   # Twitter only — 3 PM ET
    - cron: '0 23 * * *'   # Twitter only — 7 PM ET (evening update, matches still in play)
    - cron: '0 4  * * *'   # Full run (IG + Twitter + Facebook copy) — midnight ET, all results in
  workflow_dispatch:
    inputs:
      twitter_only:
        description: 'Twitter only (skip IG render + publish)'
        required: false
        default: 'false'

jobs:
  publish:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repo
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install dependencies
        working-directory: scripts/content-engine
        run: |
          pip install -r requirements.txt
          playwright install chromium

      - name: Run content engine
        working-directory: scripts/content-engine
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          FOOTBALL_DATA_API_KEY: ${{ secrets.FOOTBALL_DATA_API_KEY }}
          IG_ACCESS_TOKEN: ${{ secrets.MATCH_HIVE_IG_ACCESS_TOKEN }}
          IG_USER_ID: ${{ secrets.MATCH_HIVE_IG_USER_ID }}
          IMGBB_API_KEY: ${{ secrets.IMGBB_API_KEY }}
          TWITTER_API_KEY: ${{ secrets.MATCH_HIVE_TWITTER_API_KEY }}
          TWITTER_API_SECRET: ${{ secrets.MATCH_HIVE_TWITTER_API_SECRET }}
          TWITTER_ACCESS_TOKEN: ${{ secrets.MATCH_HIVE_TWITTER_ACCESS_TOKEN }}
          TWITTER_ACCESS_SECRET: ${{ secrets.MATCH_HIVE_TWITTER_ACCESS_SECRET }}
          # Full run at 04 UTC only — Twitter-only for all other scheduled runs
          TWITTER_ONLY: ${{ (github.event.schedule == '0 11 * * *' || github.event.schedule == '0 15 * * *' || github.event.schedule == '0 19 * * *' || github.event.schedule == '0 23 * * *') && 'true' || github.event.inputs.twitter_only || 'false' }}
        run: |
          if [ "$TWITTER_ONLY" = "true" ]; then
            python main.py --twitter-only
          else
            python main.py
          fi

      - name: Commit updated schedule files
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add scripts/content-engine/output/schedule.json \
                  scripts/content-engine/output/twitter_schedule.json \
                  scripts/content-engine/output/facebook_copy.json || true
          git diff --staged --quiet || git commit -m "chore: update content schedule [skip ci]"
          git push || true
